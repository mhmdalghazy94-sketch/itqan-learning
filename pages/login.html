<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="سجّل الدخول إلى حسابك في إتقان للتعلم.">
    <title>تسجيل الدخول | إتقان للتعلم</title>
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/pages/auth.css">
    <link rel="stylesheet" href="../src/css/responsive.css">
    <script type="module" src="../src/js/auth/forms.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">انتقل إلى المحتوى</a>
    <div id="site-header"></div>
    <main id="main-content" class="auth-page section-shell">
      <header class="auth-intro">
        <p class="eyebrow">مرحبًا بعودتك</p>
        <h1>تسجيل الدخول</h1>
        <p>استخدم الحساب نفسه للوصول إلى مساحتك في إتقان للتعلم.</p>
      </header>
      <section class="auth-panel" aria-label="نموذج تسجيل الدخول">
        <form class="auth-form" data-auth-form="login">
          <div class="auth-field">
            <label for="login-email">البريد الإلكتروني</label>
            <input id="login-email" name="email" type="email" autocomplete="username" maxlength="254" required>
          </div>
          <div class="auth-field">
            <label for="login-password">كلمة المرور</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="auth-form__actions">
            <button class="button button--primary" type="submit" disabled>تسجيل الدخول</button>
            <p class="auth-status" data-auth-status aria-live="polite"></p>
          </div>
        </form>
        <nav class="auth-links" aria-label="روابط الحساب">
          <a href="./forgot-password.html">نسيت كلمة المرور؟</a>
          <a href="./register.html">إنشاء حساب جديد</a>
          <a href="./welcome.html">متابعة التصفح كزائر</a>
        </nav>
      </section>
      <noscript><p class="auth-note">لتسجيل الدخول، فعّل JavaScript في المتصفح.</p></noscript>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
