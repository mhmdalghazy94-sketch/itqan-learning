<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مجالات العلوم | إتقان للتعلم</title>
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/pages/platforms.css">
    <link rel="stylesheet" href="../src/css/responsive.css">
    <script type="module" src="../src/js/pages/sciences.js"></script>
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="section-shell" style="padding-top: 3rem; padding-bottom: 2rem;">
        <div class="section-heading">
          <div>
            <p class="eyebrow"><span class="eyebrow__dot"></span> فروع المعرفة والتعلم</p>
            <h1>مجالات العلوم المتخصصة</h1>
            <p class="section-heading__description">
              تعرّف على المجالات والمنصات التعليمية المقترحة، وتحقق من حالة كل منصة قبل الانتقال إليها. لا يظهر رابط المنصة إلا بعد إضافة عنوانها المنشور.
            </p>
          </div>
        </div>

        <form class="platform-filters" role="search" aria-label="البحث في مجالات العلوم">
          <label class="platform-search">
            <span class="platform-search__icon" aria-hidden="true">⌕</span>
            <span class="visually-hidden">ابحث عن مجال</span>
            <input id="science-search" type="search" placeholder="ابحث عن مجال أو تخصص..." autocomplete="off">
          </label>
          <label class="platform-filter">
            <span>حالة المنصة</span>
            <select id="science-status">
              <option value="all">جميع الحالات</option>
              <option value="available">متاحة</option>
              <option value="in-development">قيد التطوير</option>
              <option value="coming-soon">قريبًا</option>
            </select>
          </label>
        </form>
        <p id="science-count" class="platform-count" role="status" aria-live="polite">جارٍ تحميل المجالات…</p>
        <div class="platform-grid" id="sciences-grid" aria-live="polite">
          <p class="content-message" role="status">جارٍ تحميل المجالات…</p>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <noscript><p class="noscript-message">يرجى تفعيل JavaScript لتحميل المجالات واستخدام البحث والتصفية.</p></noscript>
  </body>
</html>
