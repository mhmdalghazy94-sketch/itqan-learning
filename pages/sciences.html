<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مجالات العلوم | إتقان للتعلم</title>
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/pages/platforms.css">
    <link rel="stylesheet" href="../src/css/responsive.css">
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="section-shell" style="padding-top: 3rem; padding-bottom: 2rem;">
        <div class="section-heading">
          <div>
            <p class="eyebrow"><span class="eyebrow__dot"></span> فروع المعرفة والتعلم</p>
            <h1>مجالات العلوم المتخصصة</h1>
            <p class="section-heading__description">
              تصفح مجالات العلوم والمعارف المتاحة في إتقان للتعلم؛ حيث يمتلك كل مجال مستودعاً ومقررات تعليمية مستقلة ومنهجية.
            </p>
          </div>
        </div>

        <div class="platform-grid" id="sciences-grid">
          <!-- Dynamic Sciences Cards -->
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { renderHeader } from '../src/js/components/header.js';
      import { renderFooter } from '../src/js/components/footer.js';

      const header = document.querySelector('#site-header');
      const footer = document.querySelector('#site-footer');
      if (header) renderHeader(header, { basePath: '../', currentPage: 'platforms' });
      if (footer) renderFooter(footer, { basePath: '../' });

      async function loadSciences() {
        const container = document.getElementById('sciences-grid');
        try {
          const res = await fetch('../data/sciences.json');
          const sciences = await res.json();

          container.innerHTML = sciences.map(s => `
            <article class="platform-card platform-card--featured">
              <div class="platform-card__top">
                <span class="platform-card__icon" style="background:${s.color}15; color:${s.color}">${s.icon}</span>
                <span class="status-badge ${s.status === 'ready' ? 'status-badge--available' : 'status-badge--in-development'}">
                  ${s.status === 'ready' ? 'متاح ومفعل' : 'قيد التطوير والتجهيز'}
                </span>
              </div>
              <h2 class="platform-card__title">${s.name}</h2>
              <p class="platform-card__description">${s.description}</p>
              
              <div style="font-size:0.82rem; color:var(--color-muted); margin-bottom:1rem; display:flex; gap:1rem;">
                <span>📚 ${s.coursesCount} مقرراً</span>
                <span>👥 ${s.studentsCount.toLocaleString('ar-EG')} طالباً</span>
              </div>

              <div class="platform-card__actions">
                <a href="science-details.html?id=${s.id}" class="button button--primary button--small">استعراض المجال والدورات ←</a>
                <a href="${s.repositoryUrl}" target="_blank" rel="noopener noreferrer" class="platform-card__action platform-card__action--visit">
                  المستودع البرمجي ↗
                </a>
              </div>
            </article>
          `).join('');
        } catch (e) {
          console.error(e);
          container.innerHTML = '<p class="content-message content-message--error">تعذر تحميل بيانات مجالات العلوم.</p>';
        }
      }

      loadSciences();
    </script>
  </body>
</html>
