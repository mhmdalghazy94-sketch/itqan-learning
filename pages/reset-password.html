<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="عيّن كلمة مرور جديدة بعد التحقق من رابط الاستعادة.">
    <meta name="referrer" content="no-referrer">
    <title>تعيين كلمة مرور جديدة | إتقان للتعلم</title>
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/pages/auth.css">
    <link rel="stylesheet" href="../src/css/responsive.css">
    <script type="module" src="../src/js/auth/forms.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">انتقل إلى المحتوى</a>
    <div id="site-header"></div>
    <main id="main-content" class="auth-page section-shell">
      <header class="auth-intro">
        <p class="eyebrow">استعادة الحساب</p>
        <h1>تعيين كلمة مرور جديدة</h1>
        <p>لا تُرسل كلمة المرور إلى أي جهة غير خدمة الحسابات الموثوقة.</p>
      </header>
      <section class="auth-panel" aria-label="تعيين كلمة المرور">
        <form class="auth-form" data-auth-form="reset-password">
          <div class="auth-field">
            <label for="new-password">كلمة المرور الجديدة</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="auth-field">
            <label for="confirm-new-password">تأكيد كلمة المرور الجديدة</label>
            <input id="confirm-new-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="auth-form__actions">
            <button class="button button--primary" type="submit" disabled>تحديث كلمة المرور</button>
            <p class="auth-status" data-auth-status aria-live="polite"></p>
          </div>
        </form>
        <nav class="auth-links" aria-label="روابط الحساب"><a href="./forgot-password.html">طلب رابط جديد</a></nav>
      </section>
      <noscript><p class="auth-note">لتعيين كلمة مرور جديدة، فعّل JavaScript في المتصفح.</p></noscript>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
