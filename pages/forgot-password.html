<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="اطلب تعليمات آمنة لإعادة تعيين كلمة المرور.">
    <title>استعادة كلمة المرور | إتقان للتعلم</title>
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/reset.css">
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/layout.css">
    <link rel="stylesheet" href="../src/css/components.css">
    <link rel="stylesheet" href="../src/css/pages/auth.css">
    <link rel="stylesheet" href="../src/css/responsive.css">
    <script type="module" src="../src/js/auth/forms.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">انتقل إلى المحتوى</a>
    <div id="site-header"></div>
    <main id="main-content" class="auth-page section-shell">
      <header class="auth-intro">
        <p class="eyebrow">استعادة آمنة</p>
        <h1>نسيت كلمة المرور؟</h1>
        <p>أدخل البريد المرتبط بحسابك. سنعرض رسالة عامة حفاظًا على خصوصية الحسابات.</p>
      </header>
      <section class="auth-panel" aria-label="طلب إعادة تعيين كلمة المرور">
        <form class="auth-form" data-auth-form="forgot-password">
          <div class="auth-field">
            <label for="recovery-email">البريد الإلكتروني</label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <div class="auth-form__actions">
            <button class="button button--primary" type="submit" disabled>إرسال تعليمات الاستعادة</button>
            <p class="auth-status" data-auth-status aria-live="polite"></p>
          </div>
        </form>
        <nav class="auth-links" aria-label="روابط الحساب">
          <a href="./login.html">العودة إلى تسجيل الدخول</a>
        </nav>
      </section>
      <noscript><p class="auth-note">لاستعادة كلمة المرور، فعّل JavaScript في المتصفح.</p></noscript>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
